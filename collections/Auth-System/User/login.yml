info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_HTTP_URL}}/users/login"
  body:
    type: json
    data: |-
      {
        "email": "1",
        "password": "1",
        "device_id": "{{$randomUUID}}",
        "device_info": {
          "platform": "Windows",
          "os_version": 11,
          "client": "desktop",
          "client_version": "0.1.0"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        bru.setGlobalEnvVar('access_token', response.access_token);
        bru.setGlobalEnvVar('refresh_token', response.refresh_token);
        //console.log(Object.keys(bru));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
