info:
  name: get_user_servers
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_HTTP_URL}}/servers?role=member"
  params:
    - name: role
      value: member
      type: query
  auth:
    type: bearer
    token: "{{access_token2}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        bru.setGlobalEnvVar('server_id', response[0].id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
